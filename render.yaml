services:
  - type: web
    name: collectam
    repo: https://github.com/lionel299/lionel-portfolio
    branch: main
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGODB_URI
        sync: false

  - type: web
    name: post
    repo: https://github.com/lionel299/collectam
    branch: main
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VUE_APP_API_URL
        value: https://backend.onrender.com

